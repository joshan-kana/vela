[workspace]
resolver = "3"
members = ["crates/vela-core", "crates/vela-ffi", "crates/vela-youtrack"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
url = "2"
